# Homarr secrets — managed externally via BWS, not committed with real values.
# The SECRET_ENCRYPTION_KEY encrypts the database. Generate with: openssl rand -hex 32
# This secret is created manually (not via git) for security.
# ArgoCD selfHeal will not remove it since it's applied via kubectl, not git.
#
# Create the secret with (BUG-FIX 2026-08-29, t_169902ab):
#   kubectl create secret generic homarr \
#     --from-literal=SECRET_ENCRYPTION_KEY=$(openssl rand -hex 32) \
#     --from-literal=AUTH_SECRET=$(openssl rand -base64 32) \
#     --from-literal=AUTH_PROVIDERS=credentials \
#     --from-literal=AUTH_TRUST_HOST=true \
#     --namespace=homarr
#
# CRITICAL FIELDS (missing/!wrong => login fails with error=Configuration):
#   AUTH_SECRET        - NextAuth/Auth.js secret. REQUIRED. 32-byte random (openssl rand -base64 32).
#   AUTH_PROVIDERS     - Comma-separated string (NOT JSON!). Must be "credentials"
#                        for local user/pass login. Other options: ldap, oidc.
#                        WRONG values that break login: "[credentials]" (invalid JSON -> [])
#                        or ["credentials"] (valid JSON but schema expects a plain string -> []).
#                        With an empty/!invalid value the credentials provider is disabled
#                        server-side and login returns error=Configuration (ZodError name).
#   AUTH_TRUST_HOST     - "true" when Homarr sits behind a reverse proxy (Traefik here).
#                        Without it Auth.js rejects the proxied host (UntrustedHost ->
#                        surfaced as error=Configuration).
#   SECRET_ENCRYPTION_KEY - already-required DB encryption key (openssl rand -hex 32).
#
# NOT used by v1.32.0 (do NOT set, it has a built-in redis):
#   REDIS_URL / REDIS_* / DOCKER_HOSTNAMES (v0-era vars; the v1 zod env validator
#   rejects unknown vars and /api/health returns 500).
#
# This file exists only to document the expected secret structure.
# ArgoCD will skip it during sync (the deployment uses optional: true on secretRef).
