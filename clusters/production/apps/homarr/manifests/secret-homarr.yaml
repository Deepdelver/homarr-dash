# Homarr secrets — managed externally via SealedSecret or BWS.
# The SECRET_ENCRYPTION_KEY is auto-generated by Homarr on first boot if not provided.
# Generate one: openssl rand -hex 32
#
# For production, create this secret using:
#   kubectl create secret generic homarr \
#     --from-literal=SECRET_ENCRYPTION_KEY=$(openssl rand -hex 32) \
#     --namespace=homarr --dry-run=client -o yaml
#
# Or use SealedSecrets / BWS for GitOps-safe secret management.
#
# This file is a placeholder — ArgoCD will not sync it as a real secret.
# The deployment has `optional: true` on the secretRef, so Homarr will
# auto-generate a key on first boot if this secret doesn't exist.
