# Homarr secrets — managed externally via SealedSecret or BWS.
# The ENCRYPTION_KEY is auto-generated by Homarr on first boot and stored
# in the database PVC. Do NOT commit real secrets to git.
#
# To pre-generate an encryption key:
#   openssl rand -hex 32
#
# Apply manually (not in ArgoCD):
#   kubectl create secret generic homarr -n homarr \
#     --from-literal=ENCRYPTION_KEY=$(openssl rand -hex 32) \
#     --from-literal=DOCKER_HOSTNAMES="localhost,host.docker.internal" \
#     --dry-run=client -o yaml
