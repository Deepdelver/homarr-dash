# Homarr secrets — managed externally via BWS, not committed with real values.
# The SECRET_ENCRYPTION_KEY encrypts the database. Generate with: openssl rand -hex 32
# This secret is created manually (not via git) for security.
# ArgoCD selfHeal will not remove it since it's applied via kubectl, not git.
#
# Create the secret with:
#   kubectl create secret generic homarr \
#     --from-literal=SECRET_ENCRYPTION_KEY=$(openssl rand -hex 32) \
#     --from-literal=REDIS_URL=redis://localhost:6379 \
#     --namespace=homarr
#
# This file exists only to document the expected secret structure.
# ArgoCD will skip it during sync (the deployment uses optional: true on secretRef).
