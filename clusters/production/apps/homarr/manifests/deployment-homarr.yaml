apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: homarr
  labels:
    app: homarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homarr
    spec:
      containers:
      - name: homarr
        # Pinned to the real stable v1.x release (v1.32.0 — verified on ghcr, 2026-08-27).
        # NOTE: homarr v1.32.0 runs its OWN built-in Redis server (REDIS_IS_EXTERNAL=false,
        # listening on 127.0.0.1:6379 inside the container). Do NOT add a redis sidecar —
        # it logs "Address in use" on 6379 and adds no value. The only real fix for the
        # earlier OOMKilled was raising the memory limit below (512Mi was too small for
        # the Next.js + built-in redis process under load).
        image: ghcr.io/homarr-labs/homarr:v1.32.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7575
          name: http
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3000"
        - name: NEXT_PUBLIC_DEPLOYMENT
          value: "kubernetes"
        envFrom:
        - secretRef:
            name: homarr
            optional: true
        volumeMounts:
        - name: data
          mountPath: /appdata
        livenessProbe:
          httpGet:
            path: /
            port: 7575
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 7575
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: homarr-database
