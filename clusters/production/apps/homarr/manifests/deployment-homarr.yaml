apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: homarr
  labels:
    app: homarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homarr
    spec:
      containers:
      - name: homarr
        image: ghcr.io/homarr-labs/homarr:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7575
          name: http
        env:
        - name: NODE_ENV
          value: production
        - name: DOCKER_HOSTNAMES
          value: "localhost,host.docker.internal"
        envFrom:
        - secretRef:
            name: homarr
            optional: true
        volumeMounts:
        - name: appdata
          mountPath: /appdata
        livenessProbe:
          httpGet:
            path: /api/health
            port: 7575
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 7575
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: appdata
        hostPath:
          path: /var/lib/homarr/appdata
          type: DirectoryOrCreate
