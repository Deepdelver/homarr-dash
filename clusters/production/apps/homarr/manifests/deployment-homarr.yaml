apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: homarr
  labels:
    app: homarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homarr
    spec:
      containers:
      - name: homarr
        # Pinned to the real latest stable v1.x release.
        # - 0.156.0 (spec'd originally) does NOT exist on ghcr.io (registry 404).
        # - v1.76.0 also does NOT exist; highest real tag is v1.32.0 (verified via ghcr.io, 2026-08-27).
        # - v1.32.0 declares DB_URL=/appdata/db/db.sqlite + Volumes{/appdata}, matching this mount + PORT=3000.
        # - :latest was reverted: it drifted to a different image and reintroduced the nginx/Next.js EADDRINUSE issue.
        # Redis sidecar (redis:7-alpine) below provides the 127.0.0.1:6379 cache homarr v1.32.0 expects,
        # eliminating the prior ECONNREFUSED errors seen in the pod log.
        image: ghcr.io/homarr-labs/homarr:v1.32.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7575
          name: http
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3000"
        - name: NEXT_PUBLIC_DEPLOYMENT
          value: "kubernetes"
        envFrom:
        - secretRef:
            name: homarr
            optional: true
        volumeMounts:
        - name: data
          mountPath: /appdata
        livenessProbe:
          httpGet:
            path: /
            port: 7575
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 7575
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
          name: redis
        command: ["redis-server", "--appendonly", "yes"]
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: homarr-database
      - name: redis-data
        emptyDir: {}
