apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: homarr
  labels:
    app: homarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homarr
    spec:
      containers:
      - name: homarr
        # Pinned: v1.32.0 (verified on ghcr.io, 2026-08-27).
        # - Includes built-in Redis — do NOT add sidecar or REDIS_URL.
        # - PORT=3000: nginx front-door listens on 7575, proxies to Next.js on 3000.
        # PITFALL (2026-08-27): a redis SIDECAR once wrote /appdata/redis/dump.rdb
        # in RDB format v14 (redis:7). The bundled redis 8.0.3 cannot load v14 ->
        # "Can't handle RDB format version 14" -> redis dies -> ioredis ECONNREFUSED
        # -> readiness fails -> 503 "no available server". If you ever swap redis
        # versions, delete dump.rdb on the PVC first. Never mix redis versions on
        # the same /appdata/redis volume.
        image: ghcr.io/homarr-labs/homarr:v1.32.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7575
          name: http
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3000"
        envFrom:
        - secretRef:
            name: homarr
            optional: true
        volumeMounts:
        - name: data
          mountPath: /appdata
        livenessProbe:
          httpGet:
            path: /
            port: 7575
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 7575
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            # 512Mi OOMKilled the single container (nextjs + tasks + wss + nginx + internal redis).
            # 1Gi gives the bundled redis + nextjs headroom under board load.
            memory: 1024Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: homarr-database
