apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: homarr
  labels:
    app: homarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homarr
    spec:
      containers:
      - name: homarr
        # NOTE: task spec referenced 0.156.0, but that tag does not exist on
        # ghcr.io/homarr-labs/homarr (registry returns "not found"). The v1 line
        # (latest) is the working image on this node. Pin a real release tag once
        # a stable v1.x is chosen.
        image: ghcr.io/homarr-labs/homarr:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7575
          name: http
        env:
        - name: NODE_ENV
          value: production
        - name: DOCKER_HOSTNAMES
          value: "localhost,host.docker.internal"
        # v1 image: nginx is the front door on 7575 and reverse-proxies to this
        # PORT. Do NOT set 7575 here or Next.js collides with nginx (EADDRINUSE).
        - name: PORT
          value: "3000"
        envFrom:
        - secretRef:
            name: homarr
            optional: true
        volumeMounts:
        - name: data
          mountPath: /appdata
        livenessProbe:
          httpGet:
            path: /
            port: 7575
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 7575
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: homarr-database
