apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: homarr
  labels:
    app: homarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homarr
    spec:
      containers:
      - name: homarr
        # Pinned to the real latest stable v1.x release.
        # - 0.156.0 (spec'd originally) does NOT exist on ghcr.io (registry 404).
        # - v1.76.0 (spec's "recommended") also does NOT exist; highest real tag
        #   is v1.32.0 (verified via ghcr.io tag list, 2026-08-27).
        # - v1.32.0 image config declares DB_URL=/appdata/db/db.sqlite and
        #   Volumes{/appdata}, matching this manifest's /appdata mount + PORT=3000.
        #   Avoids the :latest drift risk and the prior nginx/Next.js EADDRINUSE.
        image: ghcr.io/homarr-labs/homarr:v1.32.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7575
          name: http
        env:
        - name: NODE_ENV
          value: production
        # v1 image: nginx is the front door on 7575 and reverse-proxies to this
        # PORT. Do NOT set 7575 here or Next.js collides with nginx (EADDRINUSE).
        - name: PORT
          value: "3000"
        # NOTE: do NOT set DOCKER_HOSTNAMES here. That is a v0-era variable that
        # does not exist in the v1 zod env schema; the strict validator throws
        # "Invalid environment variables" and /api/health returns 500.
        envFrom:
        - secretRef:
            name: homarr
            optional: true
        volumeMounts:
        - name: data
          mountPath: /appdata
        livenessProbe:
          httpGet:
            path: /
            port: 7575
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 7575
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: homarr-database
